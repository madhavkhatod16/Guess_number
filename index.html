<!doctype html>
<html>
<head>
    <title>Guess the Number</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box">
    <h1>Guess the Number</h1>

    <div class="section">

        <div class="control-group">
            <h2 id="status-title">Create a Number</h2>
            <button class="btn" id="generate-btn">Generate</button>
        </div>

        <div id="guess-container">
            <input class="input" id="guess-input" type="number" placeholder="Enter your guess...">
            <button class="btn" id="submit-btn">Submit</button>
        </div>

        <div class="message" id="message-box">
            Click Generate to start!
        </div>

        <div class="options-container" id="options-box"></div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
